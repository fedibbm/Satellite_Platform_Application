# =============================================================================
# SATELLITE IMAGE PROCESSOR - PERSISTENT VOLUME CLAIM
# Storage for processed satellite images (NDVI, EVI, colorized outputs)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-processor-storage
  namespace: satellite-platform
  labels:
    app: image-processor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
