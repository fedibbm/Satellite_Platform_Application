# =============================================================================
# SATELLITE GEE SERVICE - DEPLOYMENT SPECIFICATION
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gee-service
  namespace: satellite-platform
  labels:
    app: gee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gee-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gee-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gee-service
          image: satellite-gee:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: gee-config
          volumeMounts:
            - name: gee-secret-vol
              mountPath: /etc/gee-secrets
              readOnly: true
            - name: gee-downloads-vol
              mountPath: /app/downloads
            - name: scratch-cache
              mountPath: /app/cache
            - name: scratch-output
              mountPath: /app/output
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gee-secret-vol
          secret:
            secretName: gee-secret
        - name: gee-downloads-vol
          persistentVolumeClaim:
            claimName: gee-storage
        - name: scratch-cache
          emptyDir: {}
        - name: scratch-output
          emptyDir: {}
