# =============================================================================
# SATELLITE FRONTEND - INGRESS ROUTING SPECIFICATION
# Routes: Host: satellite.localhost -> Service: satellite-frontend (Port 3000)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: satellite-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: satellite.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: satellite-frontend
                port:
                  number: 3000
