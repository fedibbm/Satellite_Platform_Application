# =============================================================================
# SATELLITE BACKEND - DEPLOYMENT SPECIFICATION
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-backend
  namespace: satellite-platform
  labels:
    app: satellite-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: satellite-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: backend
          image: satellite-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: storage-volume
              mountPath: /app/upload-dir
            - name: logs-volume
              mountPath: /app/logs
            - name: tmp-volume
              mountPath: /app/tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: backend-storage
        - name: logs-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
