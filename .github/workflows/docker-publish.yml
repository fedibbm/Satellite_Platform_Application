name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - workflow
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./Backend
            dockerfile: ./Backend/Dockerfile
            image: satellite-backend
          - name: frontend
            context: ./FrontEnd
            dockerfile: ./FrontEnd/Dockerfile
            image: satellite-frontend
          - name: gee-service
            context: ./gee_app_with_cache_logic
            dockerfile: ./gee_app_with_cache_logic/Dockerfile
            image: satellite-gee-service
          - name: image-processing
            context: ./image_porcessing
            dockerfile: ./image_porcessing/Dockerfile
            image: satellite-image-processing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (backend only)
        if: matrix.name == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar (backend only)
        if: matrix.name == 'backend'
        working-directory: ./Backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy SHA Images to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Configure GHCR registry on Container Apps
        run: |
          az containerapp registry set \
            --name "${{ vars.ACA_BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GHCR_PAT }}"

          az containerapp registry set \
            --name "${{ vars.ACA_FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GHCR_PAT }}"

          az containerapp registry set \
            --name "${{ vars.ACA_GEE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GHCR_PAT }}"

          az containerapp registry set \
            --name "${{ vars.ACA_IMAGE_PROC_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GHCR_PAT }}"

      - name: Deploy backend image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-backend:${{ env.IMAGE_TAG }}"

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-frontend:${{ env.IMAGE_TAG }}"

      - name: Deploy GEE image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_GEE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-gee-service:${{ env.IMAGE_TAG }}"

      - name: Deploy image processing image
        run: |
          az containerapp update \
            --name "${{ vars.ACA_IMAGE_PROC_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-image-processing:${{ env.IMAGE_TAG }}"
