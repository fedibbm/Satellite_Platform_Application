name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - workflow
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./Backend
            dockerfile: ./Backend/Dockerfile
            image: satellite-backend
          - name: frontend
            context: ./FrontEnd
            dockerfile: ./FrontEnd/Dockerfile
            image: satellite-frontend
          - name: gee-service
            context: ./gee_app_with_cache_logic
            dockerfile: ./gee_app_with_cache_logic/Dockerfile
            image: satellite-gee-service
          - name: image-processing
            context: ./image_porcessing
            dockerfile: ./image_porcessing/Dockerfile
            image: satellite-image-processing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (backend only)
        if: matrix.name == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar (backend only)
        if: matrix.name == 'backend'
        working-directory: ./Backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
