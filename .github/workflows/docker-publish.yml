name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - workflow
      - workflow_nocicd
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./Backend
            dockerfile: ./Backend/Dockerfile
            image: satellite-backend
          - name: frontend
            context: ./FrontEnd
            dockerfile: ./FrontEnd/Dockerfile
            image: satellite-frontend
          - name: gee-service
            context: ./gee_app_with_cache_logic
            dockerfile: ./gee_app_with_cache_logic/Dockerfile
            image: satellite-gee-service
          - name: image-processing
            context: ./image_porcessing
            dockerfile: ./image_porcessing/Dockerfile
            image: satellite-image-processing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (backend only)
        if: matrix.name == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar (backend only)
        if: matrix.name == 'backend'
        working-directory: ./Backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy SHA Images to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BACKEND_APP: ${{ vars.ACA_BACKEND_APP_NAME }}
      FRONTEND_APP: ${{ vars.ACA_FRONTEND_APP_NAME }}
      GEE_APP: ${{ vars.ACA_GEE_APP_NAME }}
      IMAGE_PROC_APP: ${{ vars.ACA_IMAGE_PROC_APP_NAME }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          trim() { echo "$1" | xargs; }

          RG="$(trim "${RESOURCE_GROUP}")"
          BACKEND="$(trim "${BACKEND_APP}")"
          FRONTEND="$(trim "${FRONTEND_APP}")"
          GEE="$(trim "${GEE_APP}")"
          IMGPROC="$(trim "${IMAGE_PROC_APP}")"

          [[ -n "$RG" ]] || { echo "AZURE_RESOURCE_GROUP is empty"; exit 1; }
          [[ -n "$BACKEND" ]] || { echo "ACA_BACKEND_APP_NAME is empty"; exit 1; }
          [[ -n "$FRONTEND" ]] || { echo "ACA_FRONTEND_APP_NAME is empty"; exit 1; }
          [[ -n "$GEE" ]] || { echo "ACA_GEE_APP_NAME is empty"; exit 1; }
          [[ -n "$IMGPROC" ]] || { echo "ACA_IMAGE_PROC_APP_NAME is empty"; exit 1; }

          echo "Using resource group: '$RG'"
          echo "Container apps: '$BACKEND', '$FRONTEND', '$GEE', '$IMGPROC'"

      - name: Preflight verify container apps exist
        shell: bash
        run: |
          set -euo pipefail

          trim() { echo "$1" | xargs; }
          RG="$(trim "${RESOURCE_GROUP}")"

          for app in "$(trim "${BACKEND_APP}")" "$(trim "${FRONTEND_APP}")" "$(trim "${GEE_APP}")" "$(trim "${IMAGE_PROC_APP}")"; do
            az containerapp show --name "$app" --resource-group "$RG" --query name -o tsv >/dev/null
            echo "Found container app: $app"
          done

      - name: Configure GHCR registry on Container Apps
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=$1
            local sleep_seconds=$2
            shift 2
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              n=$((n + 1))
            done
          }

          trim() { echo "$1" | xargs; }
          RG="$(trim "${RESOURCE_GROUP}")"

          for app in "$(trim "${BACKEND_APP}")" "$(trim "${FRONTEND_APP}")" "$(trim "${GEE_APP}")" "$(trim "${IMAGE_PROC_APP}")"; do
            if az containerapp show --name "$app" --resource-group "$RG" --query "properties.configuration.registries[?server=='ghcr.io'] | length(@)" -o tsv | grep -q '^1$'; then
              echo "GHCR registry already configured for $app. Skipping registry set."
            else
              retry 4 20 az containerapp registry set \
                --name "$app" \
                --resource-group "$RG" \
                --server ghcr.io \
                --username "${{ github.repository_owner }}" \
                --password "${{ secrets.GHCR_PAT }}"
            fi
          done

      - name: Deploy backend image
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=$1
            local sleep_seconds=$2
            shift 2
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              n=$((n + 1))
            done
          }
          retry 4 20 az containerapp update \
            --name "$(echo "${BACKEND_APP}" | xargs)" \
            --resource-group "$(echo "${RESOURCE_GROUP}" | xargs)" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-backend:${{ env.IMAGE_TAG }}"

      - name: Deploy frontend image
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=$1
            local sleep_seconds=$2
            shift 2
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              n=$((n + 1))
            done
          }
          retry 4 20 az containerapp update \
            --name "$(echo "${FRONTEND_APP}" | xargs)" \
            --resource-group "$(echo "${RESOURCE_GROUP}" | xargs)" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-frontend:${{ env.IMAGE_TAG }}"

      - name: Deploy GEE image
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=$1
            local sleep_seconds=$2
            shift 2
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              n=$((n + 1))
            done
          }
          retry 4 20 az containerapp update \
            --name "$(echo "${GEE_APP}" | xargs)" \
            --resource-group "$(echo "${RESOURCE_GROUP}" | xargs)" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-gee-service:${{ env.IMAGE_TAG }}"

      - name: Deploy image processing image
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=$1
            local sleep_seconds=$2
            shift 2
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              n=$((n + 1))
            done
          }
          retry 4 20 az containerapp update \
            --name "$(echo "${IMAGE_PROC_APP}" | xargs)" \
            --resource-group "$(echo "${RESOURCE_GROUP}" | xargs)" \
            --image "${{ env.REGISTRY }}/${{ github.repository_owner }}/satellite-image-processing:${{ env.IMAGE_TAG }}"

      - name: Verify deployed image tags on Azure
        shell: bash
        run: |
          set -euo pipefail

          trim() { echo "$1" | xargs; }

          RG="$(trim "${RESOURCE_GROUP}")"
          OWNER="${{ github.repository_owner }}"
          REGISTRY="${{ env.REGISTRY }}"
          TAG="${{ env.IMAGE_TAG }}"

          APPS=(
            "$(trim "${BACKEND_APP}")"
            "$(trim "${FRONTEND_APP}")"
            "$(trim "${GEE_APP}")"
            "$(trim "${IMAGE_PROC_APP}")"
          )

          IMAGES=(
            "satellite-backend"
            "satellite-frontend"
            "satellite-gee-service"
            "satellite-image-processing"
          )

          for i in "${!APPS[@]}"; do
            app="${APPS[$i]}"
            expected_image="${REGISTRY}/${OWNER}/${IMAGES[$i]}:${TAG}"
            actual_image="$(az containerapp show \
              --name "$app" \
              --resource-group "$RG" \
              --query "properties.template.containers[0].image" \
              -o tsv)"

            latest_revision="$(az containerapp show \
              --name "$app" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)"

            echo "App: $app"
            echo "Latest revision: $latest_revision"
            echo "Expected image: $expected_image"
            echo "Actual image:   $actual_image"

            if [[ "$actual_image" != "$expected_image" ]]; then
              echo "Image mismatch for $app. Deployment did not converge to expected tag."
              exit 1
            fi
          done
