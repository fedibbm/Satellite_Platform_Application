# =============================================================================
# SATELLITE PLATFORM APPLICATION - CORE ARCHITECTURE STACK
# Services: MongoDB 7, Redis 7, RabbitMQ 3, Spring Boot 3 Backend
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE TIER (Document Database)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - satellite-network

  # ---------------------------------------------------------------------------
  # 2. CACHE TIER (In-Memory Key-Value Store)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - satellite-network

  # ---------------------------------------------------------------------------
  # 3. MESSAGE BROKER TIER (Event-Driven AMQP Broker)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - satellite-network

  # ---------------------------------------------------------------------------
  # 4. APPLICATION TIER (Spring Boot 3 Core Backend)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: satellite-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Profile & Application
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Database & Cache Connections (Using Internal Docker DNS)
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      REDIS_URL: redis://redis:6379

      # RabbitMQ Connection
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}

      # Security & JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # Seed Admin Account
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@satellite.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Microservices Inter-Service Endpoints
      PYTHON_BASE_URL: ${PYTHON_BASE_URL}
      GEE_BASE_URL: ${GEE_BASE_URL}
      APP1_URL: ${APP1_URL}

      # Storage & File Paths
      PROJECT_BASE_PATH: ${PROJECT_BASE_PATH:-/app}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/app/upload-dir}
      TEMP_STORAGE_PATH: ${TEMP_STORAGE_PATH:-/app/tmp}
    volumes:
      - backend_uploads:/app/upload-dir
      - backend_logs:/app/logs
      - backend_tmp:/app/tmp
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - satellite-network

# =============================================================================
# PERSISTENT VOLUMES (Data survives container restarts)
# =============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_tmp:
    driver: local

# =============================================================================
# ISOLATED BRIDGE NETWORK (Internal DNS resolution)
# =============================================================================
networks:
  satellite-network:
    driver: bridge
    name: satellite-network
